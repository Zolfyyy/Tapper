name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Create Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: false
          version-file: "./version.json"
          skip-on-empty: false

      - name: Build
        run: |
          dotnet restore
          dotnet build -c Release
          dotnet publish Tapper/Tapper.csproj -c Release -r osx-x64 -p:Version=${{ steps.changelog.outputs.version }} -o ./publish/osx-x64

      - name: Create Release
        uses: softprops/action-gh-release@v2.3.3
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false
          files: |
            ./publish/osx-x64/*
