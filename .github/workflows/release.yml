name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release-info:
    name: Create Release Info
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.changelog.outputs.tag }}
      version: ${{ steps.changelog.outputs.version }}
      changelog: ${{ steps.changelog.outputs.clean_changelog }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Changelog
        id: changelog
        uses: TriPSs/conventional-changelog-action@v6.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-file: false
          version-file: "./version.json"
          fallback-version: "1.0.0"
          skip-on-empty: false

  build-installer:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
        include:
          - os: "macos-15"
            os-upper: "macOS"
            arch: "x64"
            rid: "osx-x64"
            ext: "pkg"

    name: Build ${{ matrix.os-upper }} Installer
    runs-on: ${{ matrix.os }}
    needs: create-release-info

    steps:
      - name: Generate Package Name
        shell: bash
        run: |
          echo "PACKAGE_NAME=Tapper-${{ needs.create-release-info.outputs.version }}-${{ matrix.os-upper }}-${{ matrix.arch }}.${{ matrix.ext }}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: |
          dotnet publish Tapper/Tapper.csproj \
            -c Release \
            --no-restore \
            -r ${{ matrix.rid }} \
            -p:Version=${{ needs.create-release-info.outputs.version }} \
            -o ./publish/${{ matrix.rid }}

      - name: Create macOS Installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_VERSION=${{ needs.create-release-info.outputs.version }}
          PACKAGE_ROOT="./package-root"
          APP_DIR="$PACKAGE_ROOT/Applications/Tapper"

          mkdir -p "$APP_DIR"
          cp -r ./publish/${{ matrix.rid }}/* "$APP_DIR/"

          chmod +x "$APP_DIR/Tapper"

          pkgbuild --root "$PACKAGE_ROOT" \
                  --identifier dev.kitrifty.tapper \
                  --version "$APP_VERSION" \
                  --install-location "/" \
                  "./publish/$PACKAGE_NAME"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: "./publish/${{ env.PACKAGE_NAME }}"

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [create-release-info, build-installer]

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v5
        with:
          path: "publish"
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2.4.1
        with:
          tag_name: ${{ needs.create-release-info.outputs.tag }}
          name: ${{ needs.create-release-info.outputs.tag }}
          body: ${{ needs.create-release-info.outputs.changelog }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: "publish/*"
